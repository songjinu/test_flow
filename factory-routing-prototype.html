*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
header{padding:14px 16px;border-bottom:1px solid #232c3d}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid #232c3d;background:#111722}

#steps li b{color:#ffd23f}

#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:#22d3ee}

</style>

<script>

const SCALE = 0.2; // meters per SVG px
const NODES = {

const EDGES = [
  ['s1','s2'],['s2','s3'],['s3','el1'],['el1','s4'],['s4','s5'],['s5','s6'],
  ['stA1','s1'],['stB1','s6'],
  ['d_lobby','s1'],['d_logi','s2'],['d_mat','s3'],['d_qa','s4'],['d_food','s5'],['d_rest','s6'],
  ['d_lineA','s2'],['d_lineB','el1'],['d_asm','s5'],
  ['t1','t2'],['t2','t3'],['t3','el2'],['el2','t4'],['t4','t5'],['t5','t6'],
  ['stA2','t1'],['stB2','t6'],
  ['d_comp','t1'],['d_off','t2'],['d_ceo','t3'],['d_arc','t4'],['d_pantry','t5'],['d_mr2','t6'],
  ['d_rd','t2'],['d_mr','t5'],
  ['d_roof','stB2',{dist:15,via:'stairB'}],
  ['stA1','stA2',{dist:15,via:'stairA'}],
  ['stB1','stB2',{dist:15,via:'stairB'}],
  ['el1','el2',{dist:10,via:'elev'}]
];
const ADJ = {};
function addEdge(a,b,opt){
  opt = opt || {};
  const A=NODES[a], B=NODES[b];
  const dist = (opt.dist!=null) ? opt.dist : Math.round(Math.hypot(A.x-B.x,A.y-B.y)*SCALE*10)/10;
  (ADJ[a]=ADJ[a]||[]).push({to:b,dist:dist,via:opt.via||null});
  (ADJ[b]=ADJ[b]||[]).push({to:a,dist:dist,via:opt.via||null});
}
EDGES.forEach(function(e){ addEdge(e[0],e[1],e[2]||{}); });
function hDist(a,b){
  const A=NODES[a], B=NODES[b];
  return Math.hypot(A.x-B.x,A.y-B.y)*SCALE;
}
function astar(start,goal){
  if(start===goal) return [start];
  const g={}, came={}, closed={}, f={}, open=[start];
  g[start]=0; f[start]=hDist(start,goal);
  while(open.length){
    let bi=0;
    for(let i=1;i<open.length;i++) if(f[open[i]]<f[open[bi]]) bi=i;
    const cur=open.splice(bi,1)[0];
    if(cur===goal){
      const p=[cur]; let c=cur;
      while(came[c]){ c=came[c]; p.unshift(c); }
      return p;
    }
    closed[cur]=1;
    const nbrs=ADJ[cur]||[];
    for(let i=0;i<nbrs.length;i++){
      const e=nbrs[i];
      if(closed[e.to]) continue;
      const ng=g[cur]+e.dist;
      if(!(e.to in g)||ng<g[e.to]){
        g[e.to]=ng; came[e.to]=cur; f[e.to]=ng+hDist(e.to,goal);
        if(open.indexOf(e.to)<0) open.push(e.to);
      }
    }
  }
  return null;
}
function findRoute(startId,goalId){
  const ids=astar(startId,goalId);
  if(!ids) return null;
  const segs=[]; let dist=0, floors=0;
  for(let i=0;i<ids.length-1;i++){
    const a=NODES[ids[i]], b=NODES[ids[i+1]];
    const e=(ADJ[ids[i]]||[]).filter(function(x){return x.to===ids[i+1];})[0];
    segs.push({from:a,to:b,dist:e.dist,via:e.via});
    dist+=e.dist; if(e.via) floors++;
  }
  return {ids:ids,segs:segs,dist:dist,floors:floors};
}
/*__LOGIC_END__*/
const VIA_NAME={elev:'엘리베이터',stairA:'계단 A',stairB:'계단 B'};
const ROOMS=[

  {name:'생산라인 B',f:1,x:280,y:40,w:240,h:240,node:'d_lineB'},
  {name:'조립공정',f:1,x:520,y:40,w:240,h:240,node:'d_asm'},
  {name:'연구개발센터',f:2,x:40,y:40,w:360,h:240,node:'d_rd'},
  {name:'대회의실',f:2,x:400,y:160,w:360,h:120,node:'d_mr'},
  {name:'옥상정원',f:2,x:400,y:40,w:360,h:120,node:'d_roof',terrace:true},
  {name:'전산실',f:2,x:40,y:340,w:120,h:220,node:'d_comp'},
  {name:'사무실',f:2,x:160,y:340,w:120,h:220,node:'d_off'},
  {name:'대표이사실',f:2,x:280,y:340,w:120,h:220,node:'d_ceo'},
  {name:'자료실',f:2,x:400,y:340,w:120,h:220,node:'d_arc'},
  {name:'탕비실',f:2,x:520,y:340,w:120,h:220,node:'d_pantry'},
  {name:'소회의실',f:2,x:640,y:340,w:120,h:220,node:'d_mr2'}
];
if (typeof document !== 'undefined'){
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map');
const toast=document.getElementById('toast');
const fromSel=document.getElementById('fromSel');
const toSel=document.getElementById('toSel');
function S(n,at,p){const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e;}
const FLOOR_G={},FAINT={},DONE={},MARKS={},GRAPH_G={};
let currentFloor=1, markerG=null, marker=null, animToken=0, lastRoute=null;
let fromName=null, toName=null;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

function buildFloors(){
  [1,2].forEach(function(f){
    const g=S('g',{id:'floor'+f},svg); FLOOR_G[f]=g;
    S('rect',{x:40,y:40,width:720,height:520,fill:'#0f1620',stroke:'#7d8ea8','stroke-width':3},g);
    S('rect',{x:40,y:280,width:720,height:60,fill:'#1b2434'},g);
    ROOMS.filter(function(r){return r.f===f;}).forEach(function(r){
      const rect=S('rect',{x:r.x,y:r.y,width:r.w,height:r.h,fill:r.terrace?'#123324':'#151d2a',
        stroke:r.terrace?'#4ade80':'#54637d','stroke-width':1.5,rx:2,style:'cursor:pointer'},g);
      rect.addEventListener('click',function(){onRoomClick(r);});
      const t=S('text',{x:r.x+r.w/2,y:r.y+r.h/2,'text-anchor':'middle','dominant-baseline':'middle',
        'font-size':r.w<140?12:14,fill:r.terrace?'#9ff0c0':'#c9d4e3','font-weight':600,'pointer-events':'none'},g);
      t.textContent=r.name;

      const dn=NODES[r.node];
      const dy=r.terrace?157:(dn.y<310?277:337);

    });
    // stairs / elevator boxes on corridor
    function box(cx,label,fill,stroke){

    fl.textContent=(f===1?'1F · 생산층':'2F · 연구·사무층');

      S('path',{d:'M760 100 H794 V310 H758',fill:'none',stroke:'#4ade80','stroke-width':2,'stroke-dasharray':'6 4',opacity:.8,'pointer-events':'none'},g);
      const rt=S('text',{x:808,y:205,'text-anchor':'middle','font-size':11,fill:'#9ff0c0','pointer-events':'none',transform:'rotate(-90 808 205)'},g);

    }

    S('line',{x1:60,y1:585,x2:160,y2:585,stroke:'#8b98ab','stroke-width':2},g);
    S('line',{x1:60,y1:580,x2:60,y2:590,stroke:'#8b98ab','stroke-width':2},g);
    S('line',{x1:160,y1:580,x2:160,y2:590,stroke:'#8b98ab','stroke-width':2},g);
    const sb=S('text',{x:110,y:576,'text-anchor':'middle','font-size':10,fill:'#8b98ab','pointer-events':'none'},g);

    const gg=S('g',{id:'graph'+f,display:'none'},g); GRAPH_G[f]=gg;
    const drawn={};

      if(NODES[a].f!==f) return;

        const b=e.to;
        if(NODES[b].f!==f) return;

      });

    if(r.name===toName){stroke='#f87171';w=3;}
    r._rect.setAttribute('stroke',stroke); r._rect.setAttribute('stroke-width',w);
  });
}
function buildSteps(route,fn,tn){
  const steps=['<b>'+fn+'</b>에서 출발합니다'];
  let run=0;
  route.segs.forEach(function(s){
    if(s.via){
      if(run>=1) steps.push('복도를 따라 약 <b>'+Math.round(run)+'m</b> 이동합니다');
      run=0;
      steps.push('<b>'+VIA_NAME[s.via]+'</b>을 이용해 <b>'+s.to.f+'층</b>으로 이동합니다');
    }else run+=s.dist;
  });
  if(run>=1) steps.push('복도를 따라 약 <b>'+Math.round(run)+'m</b> 이동합니다');
  steps.push('<b>'+tn+'</b>에 도착합니다');
  return steps;
}
function animateSeg(seg,token){
  return new Promise(function(res){
    const A=seg.from,B=seg.to;
    const dur=Math.max(250,seg.dist/14*1000);
    markerG.setAttribute('display','block');
    marker.setAttribute('cx',A.x); marker.setAttribute('cy',A.y);
    const t0=performance.now();
    function fr(t){
      if(token!==animToken){res(false);return;}
      const k=Math.min(1,(t-t0)/dur);
      marker.setAttribute('cx',A.x+(B.x-A.x)*k);
      marker.setAttribute('cy',A.y+(B.y-A.y)*k);
      if(k<1) requestAnimationFrame(fr); else res(true);
    }
    requestAnimationFrame(fr);
  });
}
async function playRoute(route){
  const token=++animToken;
  for(let i=0;i<route.segs.length;i++){
    const seg=route.segs[i];
    if(seg.via){
      showToast('<b>'+VIA_NAME[seg.via]+'</b> · '+seg.to.f+'층으로 이동 중');
      setFloor(seg.to.f);
      await sleep(1500);
      if(token!==animToken) return;
      hideToast();
    }else{
      if(currentFloor!==seg.from.f) setFloor(seg.from.f);
      const ok=await animateSeg(seg,token);
      if(!ok||token!==animToken) return;
      const d=DONE[seg.from.f];
      d.setAttribute('points',(d.getAttribute('points')+' '+seg.to.x+','+seg.to.y).trim());
    }
  }
  if(token!==animToken) return;
  showToast('목적지에 도착했습니다');
  setTimeout(hideToast,1800);
}
function render(route,fn,tn){
  clearRoute();
  [1,2].forEach(function(f){ FAINT[f].setAttribute('points',pts(route.ids,f)); });
  const s0=NODES[route.ids[0]], sN=NODES[route.ids[route.ids.length-1]];
  DONE[s0.f].setAttribute('points',s0.x+','+s0.y);
  S('circle',{cx:s0.x,cy:s0.y,r:10,fill:'#34d399',stroke:'#06281c','stroke-width':2},MARKS[s0.f]);
  S('circle',{cx:sN.x,cy:sN.y,r:10,fill:'#f87171',stroke:'#3d0a0a','stroke-width':2},MARKS[sN.f]);
  document.getElementById('routeTitle').textContent=fn+' → '+tn;
  document.getElementById('statDist').textContent=Math.round(route.dist)+'m';
  document.getElementById('statTime').textContent='약 '+Math.max(1,Math.round(route.dist/80))+'분';
  document.getElementById('statFloors').textContent=route.floors+'회';
  document.getElementById('steps').innerHTML=buildSteps(route,fn,tn).map(function(s){return '<li>'+s+'</li>';}).join('');
  setFloor(s0.f);
  playRoute(route);
}
function doRoute(){
  const f=fromSel.value, t=toSel.value;
  if(!f||!t) return;
  fromName=f; toName=t;
  refreshHighlights();
  if(f===t){showToast('출발지와 목적지가 같습니다');setTimeout(hideToast,1500);return;}
  const rf=ROOMS.filter(function(r){return r.name===f;})[0];
  const rt=ROOMS.filter(function(r){return r.name===t;})[0];
  const route=findRoute(rf.node,rt.node);
  if(!route){showToast('경로를 찾을 수 없습니다');setTimeout(hideToast,1500);return;}
  lastRoute={route:route,fromName:f,toName:t};
  render(route,f,t);
}
function onRoomClick(r){
  if(!fromName||(fromName&&toName)){fromName=r.name;toName=null;toSel.value='';}
  else{toName=r.name;toSel.value=toName;}
  fromSel.value=fromName;
  refreshHighlights();
  if(fromName&&toName) doRoute();
}
function fillSel(sel){
  [1,2].forEach(function(f){
    const og=document.createElement('optgroup');
    og.label=(f===1?'1F 생산층':'2F 연구·사무층');
    ROOMS.filter(function(r){return r.f===f;}).forEach(function(r){
      const o=document.createElement('option');o.value=r.name;o.textContent=r.name;og.appendChild(o);
    });
    sel.appendChild(og);
  });
}
buildFloors();
fillSel(fromSel); fillSel(toSel);
document.getElementById('findBtn').addEventListener('click',doRoute);
document.getElementById('replayBtn').addEventListener('click',function(){
  if(lastRoute) render(lastRoute.route,lastRoute.fromName,lastRoute.toName);
});
document.getElementById('f1Btn').addEventListener('click',function(){setFloor(1);});
document.getElementById('f2Btn').addEventListener('click',function(){setFloor(2);});
// 보기 전환: 실내 도면 / 전체 지도 (해남 위치)
var worldMap=null;
function setMapStatus(t){
  var el=document.getElementById('mapStatus');
  if(el){ el.textContent=t; el.style.display='block'; }
}
function setView(v){
  var indoor=(v==='indoor');
  svg.style.display=indoor?'block':'none';
  document.getElementById('worldmap').style.display=indoor?'none':'block';
  document.getElementById('viewIndoorBtn').classList.toggle('active',indoor);
  document.getElementById('viewMapBtn').classList.toggle('active',!indoor);
  if(indoor){ document.getElementById('mapStatus').style.display='none'; return; }
  var wm=document.getElementById('worldmap');
  setMapStatus('지도 상태: 초기화 중… (L='+(typeof L)+')');
  if(typeof L==='undefined'){
    wm.innerHTML='<div style="padding:48px 20px;text-align:center;font-size:14px;line-height:1.8">지도를 불러오지 못했어요.<br/>사파리 콘텐츠 차단기가 지도 파일을 막고 있을 수 있어요.<br/>차단기를 끄고 다시 눌러보세요.</div>';
    setMapStatus('지도 상태: 스크립트 로드 실패 (L 없음)');
    return;
  }
  if(!worldMap){
    try{
      worldMap=L.map('worldmap').setView([34.55559,126.59197],11);
    }catch(e){
      setMapStatus('지도 상태: 생성 오류 - '+e.message);
      return;
    }
    setMapStatus('지도 상태: 생성됨 · 타일 로딩 중…');
    // 타일 서버가 막혀 있을 경우를 대비해 3개 제공자를 순서대로 시도
    var tileProviders=[
      {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',attribution:'© OpenStreetMap'},
      {url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',attribution:'© OpenStreetMap © CARTO',subdomains:'abcd'},
      {url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',attribution:'© Esri'}
    ];
    var tileIndex=0, tileLayer=null, tileErrors=0;
    function addTiles(){
      var p=tileProviders[tileIndex];
      tileLayer=L.tileLayer(p.url,{maxZoom:19,attribution:p.attribution,subdomains:p.subdomains||'abc'}).addTo(worldMap);
      tileLayer.on('tileerror',function(){
        tileErrors++;
        if(tileErrors>=4 && tileIndex<tileProviders.length-1){
          tileErrors=0; tileIndex++;
          worldMap.removeLayer(tileLayer);
          setMapStatus('지도 상태: 타일 실패 → 제공자 '+(tileIndex+1)+'번 시도 중…');
          addTiles();
        }else if(tileIndex>=tileProviders.length-1){
          setMapStatus('지도 상태: 모든 타일 제공자 실패 (네트워크/차단기 확인 필요)');
        }
      });
      tileLayer.on('load',function(){ setMapStatus('지도 상태: 로딩 완료'); });
    }
    addTiles();
    L.marker([34.55559,126.59197],{icon:L.divIcon({className:'',html:'<div class="factory-pin">🏭</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(worldMap).bindPopup('한빛정밀 A동<br/>전라남도 해남군').openPopup();
    // 사파리 등에서 컨테이너 크기를 늦게 잡는 경우 대비: 크기 재계산
    setTimeout(function(){worldMap.invalidateSize();},100);
    setTimeout(function(){worldMap.invalidateSize();},600);
  }else{
    setMapStatus('지도 상태: 이미 생성됨 · 크기 재계산 중…');
    setTimeout(function(){worldMap.invalidateSize();},50);
  }
}
document.getElementById('viewIndoorBtn').addEventListener('click',function(){setView('indoor');});
document.getElementById('viewMapBtn').addEventListener('click',function(){setView('map');});
document.getElementById('graphToggle').addEventListener('change',function(e){
  const d=e.target.checked?'block':'none';
  GRAPH_G[1].setAttribute('display',d); GRAPH_G[2].setAttribute('display',d);
});
fromSel.addEventListener('change',function(){if(fromSel.value&&toSel.value)doRoute();});
toSel.addEventListener('change',function(){if(fromSel.value&&toSel.value)doRoute();});
setFloor(1);
// 첫 화면 자동 데모: 정문 로비 → 연구개발센터
setTimeout(function(){
  fromSel.value='정문 로비'; toSel.value='연구개발센터';
  doRoute();
},700);
}
</script>
